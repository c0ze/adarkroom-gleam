name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.15.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam build
      - run: gleam test
      # The shipped bundle, not just the tests: a broken Vite build or
      # po2json should fail here, not on the release tag.
      - run: npm ci
      - run: npm run build
      # The generated catalogs and Gleam modules are committed; the build
      # regenerates them, so any drift means someone forgot to commit it.
      - name: Generated files are current
        run: git diff --exit-code
