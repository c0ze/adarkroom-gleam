name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks only for what it uses.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.15.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
